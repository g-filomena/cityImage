<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" width="760" height="446" role="img" aria-label="How the cleaning steps create work for each other"><title>How the cleaning steps create work for each other</title><style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:13px;font-weight:600}
.s{font-size:12px}
.lbl{font-size:11.5px}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600}
.halo{paint-order:stroke;stroke-width:5px;stroke-linejoin:round}
.e{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.x{stroke-dasharray:6 5;opacity:.9}
.case{fill:none;stroke-width:10;stroke-linecap:butt}
.jp{stroke-width:2.5} .jj{stroke-width:2} .jk{stroke-width:3} .v{stroke-width:1.5}
.ar{fill:none;stroke-width:1.8}
.pilltxt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}
.oktxt,.notxt{font-size:11.5px;font-weight:600}
.clus{fill-opacity:.08;stroke-opacity:.55;stroke-dasharray:4 3;stroke-width:1.2}
.opt{stroke-dasharray:5 4}
.stepn{font-size:11px;font-weight:700}
.stepbg{stroke-width:1.4}

.bg{fill:#f7f8fa;stroke:#e3e6eb}
.card{fill:#ffffff;stroke:#d5dae1;stroke-width:1.2}
.loopbox{fill:#eef3fd;stroke:#c9d7f5;stroke-width:1.2}
.t{fill:#1d2530} .s,.lbl{fill:#5d6877} .m{fill:#1d2530}
.halo{stroke:#f7f8fa}
.e{stroke:#a3acb8} .k{stroke:#2563eb} .x{stroke:#dc2626}
.case{stroke:#f7f8fa}
.j,.jj{fill:#1d2530} .jj{stroke:#f7f8fa} .jp{fill:#f7f8fa;stroke:#d97706} .jk{fill:#f7f8fa;stroke:#16a34a}
.jx{fill:#dc2626} .v{fill:#f7f8fa;stroke:#5d6877}
.ar{stroke:#7b8594} .arh{fill:#7b8594}
.pill{fill:#e8ecf2} .pilltxt{fill:#3b4553}
.ok{fill:#e3f1e7} .oktxt{fill:#166534} .no{fill:#fde8e8} .notxt{fill:#991b1b}
.clus{fill:#2563eb;stroke:#2563eb} .sep{stroke:#e3e6eb} .stepn{fill:#2563eb}
.stepbg{fill:#ffffff;stroke:#2563eb}
@media (prefers-color-scheme: dark){
.bg{fill:#0f141a;stroke:#2a313a}
.card{fill:#161c24;stroke:#2f3844;stroke-width:1.2}
.loopbox{fill:#122033;stroke:#27406a;stroke-width:1.2}
.t{fill:#e6ebf1} .s,.lbl{fill:#98a3b1} .m{fill:#e6ebf1}
.halo{stroke:#0f141a}
.e{stroke:#5f6a78} .k{stroke:#60a5fa} .x{stroke:#f87171}
.case{stroke:#0f141a}
.j,.jj{fill:#e6ebf1} .jj{stroke:#0f141a} .jp{fill:#0f141a;stroke:#fbbf24} .jk{fill:#0f141a;stroke:#4ade80}
.jx{fill:#f87171} .v{fill:#0f141a;stroke:#98a3b1}
.ar{stroke:#8a95a4} .arh{fill:#8a95a4}
.pill{fill:#232b36} .pilltxt{fill:#c5cdd8}
.ok{fill:#12301f} .oktxt{fill:#86efac} .no{fill:#3a1618} .notxt{fill:#fca5a5}
.clus{fill:#60a5fa;stroke:#60a5fa} .sep{stroke:#2a313a} .stepn{fill:#60a5fa}
.stepbg{fill:#161c24;stroke:#60a5fa}
}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0.5" y="0.5" width="759" height="445" rx="12"/><rect class="card" x="25.0" y="33.0" width="230" height="54" rx="10"/><text class="m" x="140" y="57" text-anchor="middle">clean_duplicate_*</text><text class="s" x="140" y="74" text-anchor="middle">exact copies</text><rect class="card" x="505.0" y="33.0" width="230" height="54" rx="10"/><text class="m" x="620" y="57" text-anchor="middle">clean_same_vertexes_edges</text><text class="s" x="620" y="74" text-anchor="middle">a street mapped twice</text><rect class="card" x="25.0" y="373.0" width="230" height="54" rx="10"/><text class="m" x="140" y="397" text-anchor="middle">fix_dead_ends</text><text class="s" x="140" y="414" text-anchor="middle">dead_ends=True</text><rect class="card" x="505.0" y="373.0" width="230" height="54" rx="10"/><text class="m" x="620" y="397" text-anchor="middle">drop u = v</text><text class="s" x="620" y="414" text-anchor="middle">self_loops=True</text><rect class="loopbox" x="270" y="200" width="220" height="60" rx="12"/><text class="m" x="380" y="227" text-anchor="middle">simplify_graph</text><text class="s" x="380" y="244" text-anchor="middle">merge pseudo-nodes</text><line class="ar" x1="190" y1="87" x2="298" y2="198" marker-end="url(#ah)"/><text class="lbl halo" x="236" y="146" text-anchor="end">dropping a copy lowers a degree</text><line class="ar" x1="440" y1="200" x2="555" y2="89" marker-end="url(#ah)"/><text class="lbl halo" x="488" y="146" text-anchor="end">may join an already-joined pair</text><line class="ar" x1="588" y1="89" x2="473" y2="200" marker-end="url(#ah)"/><text class="lbl halo" x="542" y="150" text-anchor="start">may leave a degree-2 node</text><line class="ar" x1="190" y1="373" x2="298" y2="262" marker-end="url(#ah)"/><text class="lbl halo" x="236" y="316" text-anchor="end">peeling leaves a degree-2 junction</text><line class="ar" x1="440" y1="260" x2="555" y2="371" marker-end="url(#ah)"/><text class="lbl halo" x="488" y="316" text-anchor="end">the last merge on a loop closes it</text><line class="ar" x1="588" y1="371" x2="473" y2="262" marker-end="url(#ah)"/><text class="lbl halo" x="542" y="312" text-anchor="start">dropping it leaves degree 2</text><line class="ar" x1="505" y1="400" x2="257" y2="400" marker-end="url(#ah)"/><text class="lbl halo" x="381" y="420" text-anchor="middle">…or degree 1: a new dead end</text></svg>
