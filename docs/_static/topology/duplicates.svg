<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 186" width="760" height="186" role="img" aria-label="Duplicate nodes and edges"><title>Duplicate nodes and edges</title><style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:13px;font-weight:600}
.s{font-size:12px}
.lbl{font-size:11.5px}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600}
.halo{paint-order:stroke;stroke-width:5px;stroke-linejoin:round}
.e{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.x{stroke-dasharray:6 5;opacity:.9}
.case{fill:none;stroke-width:10;stroke-linecap:butt}
.jp{stroke-width:2.5} .jj{stroke-width:2} .jk{stroke-width:3} .v{stroke-width:1.5}
.ar{fill:none;stroke-width:1.8}
.pilltxt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}
.oktxt,.notxt{font-size:11.5px;font-weight:600}
.clus{fill-opacity:.08;stroke-opacity:.55;stroke-dasharray:4 3;stroke-width:1.2}
.opt{stroke-dasharray:5 4}
.stepn{font-size:11px;font-weight:700}
.stepbg{stroke-width:1.4}

.bg{fill:#f7f8fa;stroke:#e3e6eb}
.card{fill:#ffffff;stroke:#d5dae1;stroke-width:1.2}
.loopbox{fill:#eef3fd;stroke:#c9d7f5;stroke-width:1.2}
.t{fill:#1d2530} .s,.lbl{fill:#5d6877} .m{fill:#1d2530}
.halo{stroke:#f7f8fa}
.e{stroke:#a3acb8} .k{stroke:#2563eb} .x{stroke:#dc2626}
.case{stroke:#f7f8fa}
.j,.jj{fill:#1d2530} .jj{stroke:#f7f8fa} .jp{fill:#f7f8fa;stroke:#d97706} .jk{fill:#f7f8fa;stroke:#16a34a}
.jx{fill:#dc2626} .v{fill:#f7f8fa;stroke:#5d6877}
.ar{stroke:#7b8594} .arh{fill:#7b8594}
.pill{fill:#e8ecf2} .pilltxt{fill:#3b4553}
.ok{fill:#e3f1e7} .oktxt{fill:#166534} .no{fill:#fde8e8} .notxt{fill:#991b1b}
.clus{fill:#2563eb;stroke:#2563eb} .sep{stroke:#e3e6eb} .stepn{fill:#2563eb}
.stepbg{fill:#ffffff;stroke:#2563eb}
@media (prefers-color-scheme: dark){
.bg{fill:#0f141a;stroke:#2a313a}
.card{fill:#161c24;stroke:#2f3844;stroke-width:1.2}
.loopbox{fill:#122033;stroke:#27406a;stroke-width:1.2}
.t{fill:#e6ebf1} .s,.lbl{fill:#98a3b1} .m{fill:#e6ebf1}
.halo{stroke:#0f141a}
.e{stroke:#5f6a78} .k{stroke:#60a5fa} .x{stroke:#f87171}
.case{stroke:#0f141a}
.j,.jj{fill:#e6ebf1} .jj{stroke:#0f141a} .jp{fill:#0f141a;stroke:#fbbf24} .jk{fill:#0f141a;stroke:#4ade80}
.jx{fill:#f87171} .v{fill:#0f141a;stroke:#98a3b1}
.ar{stroke:#8a95a4} .arh{fill:#8a95a4}
.pill{fill:#232b36} .pilltxt{fill:#c5cdd8}
.ok{fill:#12301f} .oktxt{fill:#86efac} .no{fill:#3a1618} .notxt{fill:#fca5a5}
.clus{fill:#60a5fa;stroke:#60a5fa} .sep{stroke:#2a313a} .stepn{fill:#60a5fa}
.stepbg{fill:#161c24;stroke:#60a5fa}
}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0.5" y="0.5" width="759" height="185" rx="12"/><text class="t" x="185" y="28" text-anchor="middle">Duplicate nodes</text><text class="s" x="185" y="45" text-anchor="middle">same coordinates (and z, if present)</text><text class="t" x="575" y="28" text-anchor="middle">Duplicate edges</text><text class="s" x="575" y="45" text-anchor="middle">identical, or the same coordinates reversed</text><line class="sep" x1="380" y1="16" x2="380" y2="176"/><polyline class="e" points="30,105 100,105"/><polyline class="e" points="100,105 165,105"/><circle class="j" cx="30" cy="105" r="6"/><circle class="j" cx="165" cy="105" r="6"/><circle class="jj" cx="94" cy="105" r="7"/><circle class="jj" cx="106" cy="105" r="7"/><text class="lbl" x="100" y="132" text-anchor="middle">nodes 7 and 12</text><line class="ar" x1="185" y1="105" x2="215" y2="105" marker-end="url(#ah)"/><polyline class="e k" points="235,105 295,105 355,105"/><circle class="j" cx="235" cy="105" r="6"/><circle class="j" cx="355" cy="105" r="6"/><circle class="j" cx="295" cy="105" r="6"/><text class="lbl" x="295" y="132" text-anchor="middle">node 7</text><polyline class="e" points="410,100 555,100"/><polyline class="e" points="410,110 555,110"/><path class="ar" d="M475,95 l8,5 l-8,5"/><path class="ar" d="M490,105 l-8,5 l8,5"/><circle class="j" cx="410" cy="105" r="6"/><circle class="j" cx="555" cy="105" r="6"/><text class="lbl" x="482" y="134" text-anchor="middle">A→B and B→A</text><line class="ar" x1="575" y1="105" x2="605" y2="105" marker-end="url(#ah)"/><polyline class="e k" points="625,105 740,105"/><circle class="j" cx="625" cy="105" r="6"/><circle class="j" cx="740" cy="105" r="6"/><text class="lbl" x="682" y="134" text-anchor="middle">one edge</text><text class="s" x="575" y="166" text-anchor="middle">preserve_direction=True keeps both directions</text></svg>
