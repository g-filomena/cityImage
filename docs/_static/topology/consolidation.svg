}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0.5" y="0.5" width="759" height="249" rx="12"/><text class="t" x="150" y="28" text-anchor="middle">Split junction</text><text class="s" x="150" y="45" text-anchor="middle">merged at the mean of its nodes</text><text class="t" x="420" y="28" text-anchor="middle">No chaining</text><text class="s" x="420" y="45" text-anchor="middle">every pair within tolerance</text><text class="t" x="650" y="28" text-anchor="middle">Close, not linked</text><text class="s" x="650" y="45" text-anchor="middle">split back by connectivity</text><line class="sep" x1="305" y1="16" x2="305" y2="236"/><line class="sep" x1="535" y1="16" x2="535" y2="236"/><polyline class="e" points="58,90 58,210"/><polyline class="e" points="82,90 82,210"/><polyline class="e" points="15,138 125,138"/><polyline class="e" points="15,162 125,162"/><rect class="clus" x="48" y="128" width="44" height="44" rx="8"/><circle class="j" cx="58" cy="138" r="6"/><circle class="j" cx="58" cy="162" r="6"/><circle class="j" cx="82" cy="138" r="6"/><circle class="j" cx="82" cy="162" r="6"/><line class="ar" x1="138" y1="150" x2="168" y2="150" marker-end="url(#ah)"/><polyline class="e k" points="223,90 223,126 235,150"/><polyline class="e k" points="247,90 247,126 235,150"/><polyline class="e k" points="223,210 223,174 235,150"/><polyline class="e k" points="247,210 247,174 235,150"/><polyline class="e k" points="180,138 211,138 235,150"/><polyline class="e k" points="180,162 211,162 235,150"/><polyline class="e k" points="290,138 259,138 235,150"/><polyline class="e k" points="290,162 259,162 235,150"/><circle class="j" cx="235" cy="150" r="6"/><text class="lbl" x="150" y="232" text-anchor="middle">edges inside the cluster vanish (u = v)</text><polyline class="e" points="335,150 505,150"/><rect class="clus" x="322" y="136"