ead_ends</text><text class="s" x="166" y="249" text-anchor="start">peel dead-end streets back to their junction</text><rect class="pill" x="521.7" y="226" width="76.3" height="20" rx="10"/><text class="pilltxt" x="559.85" y="240.5" text-anchor="middle">dead_ends</text><circle class="stepbg" cx="128" cy="237.0" r="11"/><text class="stepn" x="128" y="241" text-anchor="middle">4</text><line class="ar" x1="380" y1="260" x2="380" y2="278" marker-end="url(#ah)"/><rect class="card opt" x="150" y="278" width="460" height="46" rx="9"/><text class="m" x="166" y="297" text-anchor="start">remove_disconnected_islands</text><text class="s" x="166" y="313" text-anchor="start">keep the largest connected component</text><rect class="pill" x="488.2" y="290" width="109.8" height="20" rx="10"/><text class="pilltxt" x="543.1" y="304.5" text-anchor="middle">remove_islands</text><circle class="stepbg" cx="128" cy="301.0" r="11"/><text class="stepn" x="128" y="305" text-anchor="middle">5</text><line class="ar" x1="380" y1="324" x2="380" y2="342" marker-end="url(#ah)"/><rect class="loopbox" x="100" y="342" width="540" height="340" rx="12"/><text class="t" x="118" y="366" text-anchor="start">6 · REPEAT UNTIL STABLE</text><text class="s" x="308" y="366" text-anchor="start">— while a pseudo-node or a street mapped twice remains</text><rect class="card" x="150" y="382" width="460" height="42" rx="9"/><text class="m" x="166" y="401" text-anchor="start">clean_duplicate_nodes</text><text class="s" x="166" y="417" text-anchor="start">merge nodes at identical coordinates</text><rect class="pill" x="541.8" y="392" width="56.2" height="20" rx="10"/><text class="pilltxt" x="569.9" y="406.5" text-anchor="middle">always</text><circle class="stepbg" cx="128" cy="403.0" r="11"/><text class="stepn" x="128" y="407" text-anchor="middle">a</text><rect class="card opt" x="150" y="432" width="460" height="42" rx="9"/><text class="m" x="166" y="451" text-anchor="start">drop u = v  ·  fix_dead_ends</text><text class="s" x="166" y="467" text-anchor="start">remove self-loops · peel dead ends</text><rect class="pill" x="521.7" y="442" width="76.3" height="20" rx="10"/><text class="pilltxt" x="559.85" y="456.5" text-anchor="middle">dead_ends</text><rect class="pill" x="432.7" y="442" width="83" height="20" rx="10"/><text class="pilltxt" x="474.2" y="456.5" text-anchor="middle">self_loops</text><circle class="stepbg" cx="128" cy="453.0" r="11"/><text class="stepn" x="128" y="457" text-anchor="middle">b</text><rect class="card" x="150" y="482" width="460" height="42" rx="9"/><text class="m" x="166" y="501" text-anchor="start">clean_duplicate_edges</text><text class="s" x="166" y="517" text-anchor="start">drop identical and reversed copies</text><rect class="pill" x="541.8" y="492" width="56.2" height="20" rx="10"/><text class="pilltxt" x="569.9" y="506.5" text-anchor="middle">always</text><circle class="stepbg" cx="128" cy="503.0" r="11"/><text class="stepn" x="128" y="507" text-anchor="middle">c</text><rect class="card opt" x="150" y="532" width="460" height="42" rx="9"/><text class="m" x="166" y="551" text-anchor="start">clean_same_vertexes_edges</text><text class="s" x="166" y="567" text-anchor="start">keep one edge per street mapped twice</text><rect class="pill" x="454.7" y="542" width="143.3" height="20" rx="10"/><text class="pilltxt" x="526.35" y="556.5" text-anchor="middle">same_vertexes_edges</text><circle class="stepbg" cx="128" cy="553.0" r="11"/><text class="stepn" x="128" y="557" text-anchor="middle">d</text><rect class="card" x="150" y="582" width="460" height="42" rx="9"/><text class="m" x="166" y="601" text-anchor="start">simplify_graph</text><text class="s" x="166" y="617" text-anchor="start">merge pseudo-nodes into single edges</text><rect class="pill" x="541.8" y="592" width="56.2" height="20" rx="10"/><text class="pilltxt" x="569.9" y="606.5" text-anchor="middle">always</text><circle class="stepbg" cx="128" cy="603.0" r="11"/><text class="stepn" x="128" y="607" text-anchor="middle">e</text><rect class="card opt" x="150" y="632" width="460" height="42" rx="9"/><text class="m" x="166" y="651" text-anchor="start">drop u = v  ·  fix_dead_ends</text><text class="s" x="166" y="667" text-anchor="start">again, on the simplified graph</text><rect class="pill" x="521.7" y="642" width="76.3" height="20" rx="10"/><text class="pilltxt" x="559.85" y="656.5" text-anchor="middle">dead_ends</text><rect class="pill" x="432.7" y="642" width="83" height="20" rx="10"/><text class="pilltxt" x="474.2" y="656.5" text-anchor="middle">self_loops</text><circle class="stepbg" cx="128" cy="653.0" r="11"/><text class="stepn" x="128" y="657" text-anchor="middle">f</text><path class="ar" d="M610,653 H632 V403 H614"/><line class="ar" x1="622" y1="403" x2="613" y2="403" marker-end="url(#ah)"/><line class="ar" x1="380" y1="682" x2="380" y2="702" marker-end="url(#ah)"/><rect class="card" x="150" y="702" width="460" height="46" rx="9"/><text class="m" x="166" y="721" text-anchor="start">correct_edge_geometries  ·  _finalize_dataframes</text><text class="s" x="166" y="737" text-anchor="start">snap edge ends to their nodes · recompute length · index by ID · restore CRS</text><circle class="stepbg" cx="128" cy="725.0" r="11"/><text class="stepn" x="128" y="729" text-anchor="middle">7</text></svg>
