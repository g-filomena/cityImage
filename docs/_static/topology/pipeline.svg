<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 770" width="760" height="770" role="img" aria-label="clean_network pipeline"><title>clean_network pipeline</title><style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:13px;font-weight:600}
.s{font-size:12px}
