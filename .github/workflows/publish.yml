name: publish

# Builds and uploads a release to PyPI when a version tag (v*) is pushed. Authentication is
# PyPI trusted publishing (OIDC): no API token is stored anywhere. The PyPI project must list
# this repository, this workflow file and the `pypi` environment as a trusted publisher.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          module=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' cityImage/__init__.py)
          if [ "$tag" != "$project" ] || [ "$tag" != "$module" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml ($project) and __init__.py ($module)"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/cityImage/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
